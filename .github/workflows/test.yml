name: Tests
# Run workflow when a PR is opened/updated targeting main
on:
  pull_request:
    branches: [main]

# This prevents duplicate workflow runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # workflow auto-kills after 15 minutes
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      # Nodejs setup
      - name: Use Node.js 20 and cache npm
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest in CI mode with coverage
        run: |
          npm test -- --ci --coverage --coverageReporters=json-summary --coverageReporters=text --json --outputFile=test-results.json

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            test-results.json
            coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

      # Post test summary comment on PR 
      - name: Comment PR with test summary
        if: always() && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- shopstr-test-summary -->';

            const safeReadJson = (path) => {
              try {
                return JSON.parse(fs.readFileSync(path, 'utf8'));
              } catch {
                return null;
              }
            };

            const testResults = safeReadJson('test-results.json');
            const coverage = safeReadJson('coverage/coverage-summary.json');

            const passedTests = testResults?.numPassedTests ?? 0;
            const failedTests = testResults?.numFailedTests ?? 0;
            const totalTests = testResults?.numTotalTests ?? 0;
            const passedSuites = testResults?.numPassedTestSuites ?? 0;
            const failedSuites = testResults?.numFailedTestSuites ?? 0;
            const totalSuites = testResults?.numTotalTestSuites ?? 0;

            const findCoverageBySuffix = (suffix) => {
              if (!coverage) return null;
              const key = Object.keys(coverage).find((k) => k.endsWith(suffix));
              return key ? coverage[key] : null;
            };

            const helperCov = findCoverageBySuffix('utils/nostr/nostr-helper-functions.ts');
            const fetchCov = findCoverageBySuffix('utils/nostr/fetch-service.ts');

            const row = (label, data) => {
              if (!data) return `| ${label} | n/a | n/a | n/a | n/a |`;
              return `| ${label} | ${data.statements.pct}% | ${data.branches.pct}% | ${data.functions.pct}% | ${data.lines.pct}% |`;
            };

            const status = failedTests > 0 || failedSuites > 0 ? 'failed' : 'passed';
            const body = [
              marker,
              '## Test Summary',
              '',
              `- Status: **${status}**`,
              `- Test suites: **${passedSuites}/${totalSuites}** passed${failedSuites ? ` (${failedSuites} failed)` : ''}`,
              `- Tests: **${passedTests}/${totalTests}** passed${failedTests ? ` (${failedTests} failed)` : ''}`,
              `- Full logs and artifacts: ${process.env.RUN_URL}`,
              '',
              '### Target Coverage',
              '',
              '| File | Stmts | Branch | Funcs | Lines |',
              '|---|---:|---:|---:|---:|',
              row('utils/nostr/nostr-helper-functions.ts', helperCov),
              row('utils/nostr/fetch-service.ts', fetchCov),
              '',
              '_Coverage source: coverage/coverage-summary.json artifact._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
